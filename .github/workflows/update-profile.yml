name: Update profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Keep existing statistics when no private token is configured
        if: env.PROFILE_STATS_TOKEN == ''
        run: |
          echo "::notice::Snake will update using GITHUB_TOKEN. Add PROFILE_STATS_TOKEN to also refresh private statistics."

      - name: Generate stats (dark)
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&card_width=440&border_radius=12&disable_animations=true&show_icons=true&rank_icon=github&custom_title=Juanlu%27s%20GitHub%20Stats&line_height=23&bg_color=0d1117&title_color=a5b4fc&text_color=c9d1d9&icon_color=67e8f9&border_color=30363d
          path: assets/stats-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate languages (dark)
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&card_width=440&border_radius=12&disable_animations=true&layout=compact&langs_count=8&hide=HTML,CSS,SCSS&custom_title=Languages%20in%20my%20repositories&bg_color=0d1117&title_color=a5b4fc&text_color=c9d1d9&icon_color=67e8f9&border_color=30363d
          path: assets/languages-dark.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate stats (light)
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&card_width=440&border_radius=12&disable_animations=true&show_icons=true&rank_icon=github&custom_title=Juanlu%27s%20GitHub%20Stats&line_height=23&bg_color=f6f8fa&title_color=5b21b6&text_color=334155&icon_color=0369a1&border_color=d0d7de
          path: assets/stats-light.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate languages (light)
        if: env.PROFILE_STATS_TOKEN != ''
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&card_width=440&border_radius=12&disable_animations=true&layout=compact&langs_count=8&hide=HTML,CSS,SCSS&custom_title=Languages%20in%20my%20repositories&bg_color=f6f8fa&title_color=5b21b6&text_color=334155&icon_color=0369a1&border_color=d0d7de
          path: assets/languages-light.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
          core_version: 2.2.1
          fail_on_error: true

      - name: Generate contribution Snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          outputs: |
            assets/snake-light.svg?color_snake=%237c3aed&color_dots=%23ebedf0,%23c4b5fd,%23a78bfa,%238b5cf6,%236d28d9
            assets/snake-dark.svg?palette=github-dark&color_snake=%2367e8f9&color_dots=%23161b22,%23312e81,%234338ca,%236366f1,%23a5b4fc

      - name: Save updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg assets/languages-dark.svg assets/languages-light.svg assets/snake-dark.svg assets/snake-light.svg
          if git diff --cached --quiet; then
            echo "Profile assets are already up to date."
            exit 0
          fi
          git commit -m "Update profile assets"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
